name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: src/antibot_sdk/vendor/aliyun/package-lock.json

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev --extra service

      - name: Install Aliyun runner dependencies
        run: npm ci --ignore-scripts
        working-directory: src/antibot_sdk/vendor/aliyun

      - name: Check Aliyun runner syntax
        run: npm run check:syntax
        working-directory: src/antibot_sdk/vendor/aliyun

      - name: Run tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check .

      - name: Build package
        run: uv build
