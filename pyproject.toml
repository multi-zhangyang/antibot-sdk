[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "antibot-sdk"
version = "0.3.0"
description = "Evidence-gated captcha solver agent harness, async browser SDK, CLI, and service."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "multi-zhangyang" }]
keywords = [
  "captcha",
  "agent-harness",
  "browser-automation",
  "cloudflare",
  "hcaptcha",
  "recaptcha",
  "arkose",
  "geetest",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: AsyncIO",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

dependencies = [
  "pydoll-python>=2.23.0",
  "requests>=2.31",
  "Pillow>=10.0",
  "playwright>=1.40",
  "captcha-recognizer>=1.0",
  "onnxruntime>=1.16,<1.24; python_version < '3.11'",
  "crack-tcaptcha>=0.0.8",
  "opencv-python>=4.8",
  "numpy>=1.26",
]

[project.optional-dependencies]
service = ["fastapi>=0.110", "uvicorn>=0.27"]
agent = ["pydantic-ai-slim[openai]>=2.14.1,<3"]
hcaptcha = [
  "ftfy>=6.1",
  "httpx[http2]>=0.24,<1",
  "importlib-metadata>=6",
  "loguru>=0.7",
  "msgpack>=1.1,<2",
  "onnxruntime>=1.16",
  "pydantic>=2.5,<3",
  "pyyaml>=6",
  "regex>=2023.0",
  "scikit-image>=0.21",
  "scikit-learn>=1.3,<2",
  "tenacity>=8,<9",
  "tqdm>=4.66",
]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/multi-zhangyang/antibot-sdk"
Documentation = "https://github.com/multi-zhangyang/antibot-sdk#readme"
Issues = "https://github.com/multi-zhangyang/antibot-sdk/issues"
Repository = "https://github.com/multi-zhangyang/antibot-sdk.git"

[project.scripts]
antibot = "antibot_sdk.cli:main"

[tool.hatch.build]
exclude = [
  "src/antibot_sdk/vendor/aliyun/node_modules/**",
  "**/__pycache__/**",
  "**/*.pyc",
  "dist/**",
  ".venv/**",
]

[tool.hatch.build.targets.wheel]
packages = ["src/antibot_sdk"]
artifacts = [
  "src/antibot_sdk/vendor/aliyun/bridge.js",
  "src/antibot_sdk/vendor/aliyun/package.json",
  "src/antibot_sdk/vendor/aliyun/package-lock.json",
  "src/antibot_sdk/vendor/aliyun/src/**/*.js",
  "src/antibot_sdk/vendor/tencent/*.py",
]
exclude = ["src/antibot_sdk/vendor/aliyun/node_modules/**"]

[tool.ruff]
line-length = 100
exclude = ["src/antibot_sdk/vendor/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["src"]
